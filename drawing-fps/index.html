<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>낙서 전쟁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14110a; --paper: #f4eddc; --yellow: #ffd23f; --red: #ff5a4e;
      --text: #f5f2ea; --dim: #9aa3b5; --panel: #161b28; --line: #313a50;
      --title: 'Black Han Sans', 'Arial Black', sans-serif;
      --hand: 'Gaegu', 'Comic Sans MS', cursive;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; }
    body { color: var(--text); font: 15px/1.4 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; user-select: none; -webkit-user-select: none; }
    #stage { position: fixed; inset: 0; }
    canvas#game { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .screen { position: absolute; inset: 0; z-index: 5; }
    .hidden { display: none !important; }
    button { font: inherit; color: inherit; }

    /* 공통 버튼: 만화 스티커 느낌 */
    .btn { font-family: var(--title); font-size: 24px; padding: 12px 34px; background: var(--yellow); color: var(--ink);
      border: 3px solid var(--ink); border-radius: 4px; box-shadow: 5px 5px 0 var(--ink); transform: skew(-7deg);
      cursor: pointer; transition: transform .08s, box-shadow .08s, filter .1s; }
    .btn > span { display: inline-block; transform: skew(7deg); }
    .btn:hover { transform: skew(-7deg) translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
    .btn:active { transform: skew(-7deg) translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    .btn:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; transform: skew(-7deg); box-shadow: 5px 5px 0 var(--ink); }
    .btn.big { font-size: 34px; padding: 14px 0; width: 100%; }
    kbd { display: inline-block; min-width: 26px; padding: 2px 7px; margin-right: 4px; text-align: center; font: 13px var(--title);
      border: 1px solid #ffffff45; border-bottom-width: 3px; border-radius: 5px; background: #ffffff12; color: #fff; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--dim); font-size: 13px; }
    .controls div { white-space: nowrap; }

    /* ── 타이틀 ── */
    #title { background: radial-gradient(ellipse at 30% 50%, #05070c55 0%, #05070cdd 75%); display: flex; flex-direction: column; justify-content: center; padding: 0 9vw; }
    .logo { font-family: var(--title); font-size: clamp(76px, 13vw, 160px); line-height: .88; color: var(--yellow);
      -webkit-text-stroke: 4px var(--ink); text-shadow: 9px 9px 0 var(--ink); transform: rotate(-5deg); transform-origin: left center; margin: 0; font-weight: normal; }
    .logo span { display: block; color: #fff; margin-left: .55em; }
    .tagline { font-family: var(--hand); font-weight: 700; font-size: clamp(24px, 3vw, 36px); color: #fff; margin: 22px 0 36px 6px; transform: rotate(-2deg); transform-origin: left; }
    .tagline mark { background: linear-gradient(transparent 55%, #ffd23faa 55%, #ffd23faa 88%, transparent 88%); color: inherit; padding: 0 4px; }
    #title .btn { align-self: flex-start; }
    .title-foot { position: absolute; left: 9vw; right: 4vw; bottom: 26px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .best-box { font-family: var(--title); color: var(--dim); font-size: 15px; text-align: right; }
    .best-box b { display: block; color: var(--yellow); font-size: 34px; font-weight: normal; }

    /* ── 무기 제작 ── */
    #workshop { background: #070a12d9; overflow: auto; }
    .ws-top { display: flex; align-items: center; gap: 16px; padding: 18px 28px 8px; }
    .ws-title { font-family: var(--title); font-weight: normal; font-size: 34px; margin: 0;
      background: linear-gradient(transparent 60%, #ffd23f66 60%, #ffd23f66 92%, transparent 92%); padding: 0 6px; }
    .ws-status { margin-left: auto; font-family: var(--title); color: var(--dim); }
    .ws-body { display: flex; justify-content: center; align-items: flex-start; gap: 44px; padding: 14px 28px 30px; }
    .ws-left { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .paper { position: relative; width: min(420px, 52vh, calc(100vw - 56px)); aspect-ratio: 1; background-color: var(--paper);
      background-image: linear-gradient(90deg, transparent 34px, #e8646455 34px, #e8646455 36px, transparent 36px),
        repeating-linear-gradient(transparent 0 25px, #7fa6d455 25px 26px);
      box-shadow: 0 2px 0 #d9cfb6, 0 22px 44px #000a; border-radius: 2px; }
    .paper::before { content: ''; position: absolute; inset: 0; z-index: -1; background: #e6dcc4; transform: rotate(3deg); box-shadow: 0 12px 30px #0008; border-radius: 2px; }
    .tape { position: absolute; width: 96px; height: 28px; background: #f6e7aac0; box-shadow: 0 1px 2px #0002; z-index: 2; pointer-events: none; }
    .tape.l { left: -26px; top: -6px; transform: rotate(-32deg); }
    .tape.r { right: -26px; top: -6px; transform: rotate(30deg); }
    #pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #pad-hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none;
      font-family: var(--hand); font-size: 30px; font-weight: 700; color: #a49a82; line-height: 1.2; transform: rotate(-4deg); }
    #pad-hint small { display: block; font-size: 21px; font-weight: 400; }
    .muzzle-note { position: absolute; right: 8px; bottom: 6px; font-family: var(--hand); font-weight: 700; font-size: 21px; color: #d65050; pointer-events: none; transform: rotate(-3deg); }
    .tray { width: min(420px, calc(100vw - 56px)); }
    .crayons { display: flex; justify-content: center; gap: 10px; height: 70px; overflow: hidden; padding: 0 14px;
      background: linear-gradient(transparent 46px, #2b3142 46px); border-radius: 0 0 8px 8px; }
    .crayon { width: 34px; height: 80px; flex: 0 0 auto; padding: 0; border: 0; cursor: pointer;
      background: linear-gradient(#ffffff45 0 20%, transparent 20% 46%, #00000030 46% 52%, transparent 52% 66%, #00000030 66% 72%, transparent 72%), var(--c);
      clip-path: polygon(30% 0, 70% 0, 100% 20%, 100% 100%, 0 100%, 0 20%); transform: translateY(22px); transition: transform .15s; }
    .crayon:hover { transform: translateY(14px); }
    .crayon.active { transform: translateY(2px); }
    .tool-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .tool-sep { width: 1px; height: 28px; background: var(--line); margin: 0 4px; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; cursor: pointer;
      background: #1b2130; border: 2px solid var(--line); border-radius: 8px; color: #dfe4ee; transition: border-color .1s, color .1s, transform .08s; }
    .icon-btn:hover { border-color: #5a6680; }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn.active { border-color: var(--yellow); color: var(--yellow); }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn i { display: block; border-radius: 50%; background: currentColor; }
    .crayon-label { margin-top: 10px; text-align: center; font-family: var(--hand); font-weight: 700; font-size: 22px; color: #e9e2cf; }
    .ws-right { width: min(390px, calc(100vw - 56px)); display: flex; flex-direction: column; gap: 22px; }
    .item-card { --tc: #9aa3b5; position: relative; overflow: hidden; padding: 18px 20px 20px; border-radius: 10px;
      background: linear-gradient(165deg, #1c2333, #10141e 70%); border: 2px solid var(--tc);
      box-shadow: 0 0 0 1px #000, 0 0 34px color-mix(in srgb, var(--tc) 30%, transparent); transition: border-color .2s, box-shadow .2s; }
    .item-card::before { content: ''; position: absolute; inset: 0 0 auto; height: 90px; background: linear-gradient(color-mix(in srgb, var(--tc) 22%, transparent), transparent); pointer-events: none; }
    .ic-head { position: relative; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .tier { font-family: var(--title); font-size: 14px; color: var(--ink); background: var(--tc); padding: 3px 12px; transform: skew(-12deg); letter-spacing: .08em; }
    .ic-kind { font-family: var(--title); font-size: 13px; color: var(--dim); }
    .ic-main { position: relative; display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    #w-thumb { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 8px; border: 1px solid #ffffff1c;
      background: radial-gradient(circle, color-mix(in srgb, var(--tc) 40%, #0b0e16), #0b0e16 72%); }
    #w-name { font-family: var(--title); font-weight: normal; font-size: 25px; line-height: 1.15; margin: 0 0 4px; }
    #w-type { margin: 0; color: var(--dim); font-size: 13px; }
    .stat { display: grid; grid-template-columns: 58px 1fr 76px; gap: 10px; align-items: center; margin: 8px 0; }
    .stat > span { font-family: var(--title); font-size: 14px; color: #c9cfdb; }
    .stat b { text-align: right; font-weight: normal; font-family: var(--title); font-size: 14px; color: var(--dim); }
    .segs { display: flex; gap: 3px; }
    .segs i { flex: 1; height: 11px; background: #283043; transform: skew(-20deg); }
    .segs i.on { background: var(--yellow); }
    .effects { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .fx { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 5px 10px 5px 7px; background: #ffffff0d; border: 1px solid #ffffff14; border-radius: 4px; }
    .fx i { width: 11px; height: 11px; transform: rotate(45deg); background: var(--c); box-shadow: 0 0 8px var(--c); }
    .fx b { font-family: var(--title); font-weight: normal; }
    .empty-note { font-family: var(--hand); font-size: 22px; color: var(--dim); text-align: center; padding: 26px 0 10px; }
    .ws-tip { font-size: 14px; color: #cfd5e0; min-height: 40px; }
    .ws-tip b { font-family: var(--title); font-weight: normal; color: var(--ink); background: var(--yellow); padding: 1px 7px; margin-right: 8px; }

    /* ── HUD ── */
    #hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--title); text-shadow: 0 2px 0 #000b; }
    #hud small { display: block; font-size: 13px; color: #c6ccd8; letter-spacing: .08em; }
    .hud-score { position: absolute; left: 26px; top: 18px; }
    .hud-score b { font-size: 36px; font-weight: normal; line-height: 1; }
    .hud-wave { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); text-align: center; }
    .hud-wave strong { display: block; font-size: 26px; font-weight: normal; }
    .enemy-track { width: 230px; height: 6px; margin: 6px auto 4px; background: #0008; border: 1px solid #ffffff25; }
    #enemy-fill { height: 100%; width: 100%; background: var(--red); transition: width .2s; }
    #enemy-label { font-size: 13px; color: #d7dce5; }
    #tip { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); font-size: 15px; color: var(--yellow); white-space: nowrap; }
    #killfeed { position: absolute; right: 20px; top: 172px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .kf { font-size: 15px; background: #000a; padding: 4px 12px; border-right: 3px solid var(--yellow); animation: kf-in .18s ease-out; transition: opacity .4s; }
    .kf em { font-style: normal; color: var(--yellow); margin-left: 6px; }
    @keyframes kf-in { from { transform: translateX(30px); opacity: 0; } }
    #banner { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .35s; white-space: nowrap; }
    #banner.show { opacity: 1; }
    #banner.show h3 { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
    #banner h3 { margin: 0; font-size: clamp(44px, 7vw, 76px); font-weight: normal; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--ink); transform: rotate(-3deg); }
    #banner p { margin: 10px 0 0; font-family: var(--hand); font-weight: 700; font-size: 26px; color: #fff; text-shadow: 0 2px 4px #000; }
    @keyframes pop { from { transform: rotate(-3deg) scale(1.6); opacity: 0; } }
    .hud-hp { position: absolute; left: 26px; bottom: 24px; display: flex; align-items: flex-end; gap: 12px; }
    .hud-hp svg { width: 30px; height: 30px; fill: #fff; margin-bottom: 4px; filter: drop-shadow(0 2px 0 #000b); }
    .hp-num { font-size: 56px; line-height: .82; }
    .hud-hp.low .hp-num, .hud-hp.low svg { color: var(--red); fill: var(--red); animation: blink .6s infinite alternate; }
    @keyframes blink { to { opacity: .45; } }
    .hp-bar { width: 220px; height: 16px; margin-bottom: 6px; background: #0009; border: 2px solid #ffffff35; transform: skew(-20deg); overflow: hidden; }
    #hp-fill { height: 100%; width: 100%; background: linear-gradient(#fff, #d8dde6); transition: width .15s; }
    .hud-hp.low #hp-fill { background: var(--red); }
    .hud-ammo { position: absolute; right: 26px; bottom: 22px; display: flex; align-items: flex-end; gap: 16px; text-align: right; }
    #weapon-thumb { width: 120px; height: 76px; filter: drop-shadow(0 3px 0 #000a); }
    #weapon-name { font-size: 14px; color: #c6ccd8; margin-bottom: 2px; }
    .ammo-line { line-height: .85; }
    #ammo { font-size: 58px; }
    #ammo-max { font-size: 22px; color: #c6ccd8; margin-left: 4px; }
    #ammo-pips { display: flex; gap: 3px; justify-content: flex-end; margin-top: 8px; }
    #ammo-pips i { width: 6px; height: 14px; background: var(--yellow); transform: skew(-18deg); }
    #ammo-pips i.empty { background: #ffffff26; }
    .hud-ammo.reloading #ammo { font-size: 30px; color: var(--yellow); animation: blink .35s infinite alternate; }

    /* ── 일시정지 / 패배 메뉴 ── */
    #menu { display: flex; align-items: center; padding-left: 9vw; background: linear-gradient(90deg, #05070cf2 0%, #05070cc0 42%, #05070c55 100%); }
    .menu-box { width: min(460px, 86vw); }
    #menu-title { font-family: var(--title); font-weight: normal; font-size: clamp(56px, 8vw, 84px); line-height: 1; margin: 0 0 18px;
      color: #fff; -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--ink); }
    #menu.lose #menu-title { color: var(--red); transform: rotate(-4deg); transform-origin: left; }
    .menu-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
    .menu-stats div { background: #ffffff0b; border-left: 3px solid var(--yellow); padding: 8px 14px; font-family: var(--title); }
    .menu-stats small { display: block; color: var(--dim); font-size: 13px; }
    .menu-stats b { font-size: 30px; font-weight: normal; }
    .new-best { display: inline-block; font-family: var(--title); color: var(--ink); background: var(--yellow); padding: 3px 12px; transform: skew(-10deg) rotate(-2deg); margin-bottom: 14px; }
    .menu-list { display: flex; flex-direction: column; margin-bottom: 26px; }
    .menu-item { position: relative; text-align: left; font-family: var(--title); font-size: 28px; background: none; border: 0; padding: 9px 18px 9px 40px; cursor: pointer; color: #e8e4da; transition: color .1s, padding .12s; }
    .menu-item::before { content: ''; position: absolute; inset: 0; background: var(--yellow); transform: skew(-12deg) scaleX(0); transform-origin: left; transition: transform .14s; z-index: -1; }
    .menu-item::after { content: '▶'; position: absolute; left: 14px; top: 50%; font-size: 15px; transform: translateY(-50%); opacity: 0; }
    .menu-item:hover, .menu-item:focus-visible { color: var(--ink); padding-left: 48px; outline: none; }
    .menu-item:hover::before, .menu-item:focus-visible::before { transform: skew(-12deg) scaleX(1); }
    .menu-item:hover::after, .menu-item:focus-visible::after { opacity: 1; left: 20px; }
    .menu-list { isolation: isolate; }

    @media (max-width: 860px) {
      .ws-body { flex-direction: column; align-items: center; }
      .hp-bar { width: 140px; }
      #weapon-thumb { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="낙서 전쟁 전장"></canvas>

    <!-- 게임 중 HUD -->
    <div id="hud" class="hidden">
      <div class="hud-score"><small>점수</small><b id="score">0</b></div>
      <div class="hud-wave"><strong id="wave-label">웨이브 1</strong><div class="enemy-track"><div id="enemy-fill"></div></div><span id="enemy-label"></span></div>
      <div id="tip"></div>
      <div id="killfeed"></div>
      <div id="banner"><h3 id="banner-title"></h3><p id="banner-text"></p></div>
      <div class="hud-hp" id="hud-hp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>
        <span class="hp-num" id="hp-text">100</span>
        <div class="hp-bar"><div id="hp-fill"></div></div>
      </div>
      <div class="hud-ammo" id="hud-ammo">
        <canvas id="weapon-thumb" width="240" height="152"></canvas>
        <div>
          <div id="weapon-name"></div>
          <div class="ammo-line"><span id="ammo">0</span><span id="ammo-max">/ 0</span></div>
          <div id="ammo-pips"></div>
        </div>
      </div>
    </div>

    <!-- 타이틀 -->
    <div id="title" class="screen">
      <h1 class="logo">낙서<span>전쟁</span></h1>
      <p class="tagline">내가 <mark>그린 대로</mark> 쏜다!</p>
      <button class="btn" id="start-btn"><span>게임 시작</span></button>
      <div class="title-foot">
        <div class="controls">
          <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>이동</div>
          <div><kbd>마우스</kbd>조준 · 사격</div>
          <div><kbd>R</kbd>재장전</div>
          <div><kbd>Q</kbd>무기 다시 그리기</div>
        </div>
        <div class="best-box">최고 기록<b id="title-best">0</b></div>
      </div>
    </div>

    <!-- 일시정지 / 패배 -->
    <div id="menu" class="screen hidden">
      <div class="menu-box">
        <h2 id="menu-title">일시정지</h2>
        <div id="menu-extra"></div>
        <div class="menu-list" id="menu-list"></div>
        <div class="controls">
          <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>이동</div>
          <div><kbd>←</kbd><kbd>→</kbd>회전</div>
          <div><kbd>클릭</kbd><kbd>Space</kbd>사격</div>
          <div><kbd>R</kbd>재장전</div>
          <div><kbd>Q</kbd>무기 다시 그리기</div>
          <div><kbd>M</kbd>소리</div>
          <div><kbd>Esc</kbd>일시정지</div>
        </div>
      </div>
    </div>

    <!-- 무기 제작 -->
    <div id="workshop" class="screen hidden">
      <div class="ws-top">
        <button class="icon-btn" id="ws-back" title="돌아가기" aria-label="돌아가기"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2 class="ws-title">무기 제작</h2>
        <span class="ws-status" id="ws-status"></span>
      </div>
      <div class="ws-body">
        <div class="ws-left">
          <div class="paper">
            <span class="tape l"></span><span class="tape r"></span>
            <canvas id="pad" width="400" height="400" aria-label="무기 그림판"></canvas>
            <div id="pad-hint">여기에 무기를 그려!<small>총, 칼, 지팡이, 아무 낙서나</small></div>
            <div class="muzzle-note">총구는 이쪽 →</div>
          </div>
          <div class="tray">
            <div class="crayons" id="palette"></div>
            <div class="tool-row">
              <button class="icon-btn" data-size="5" title="가늘게" aria-label="가늘게"><i style="width:6px;height:6px"></i></button>
              <button class="icon-btn active" data-size="10" title="보통" aria-label="보통"><i style="width:11px;height:11px"></i></button>
              <button class="icon-btn" data-size="18" title="굵게" aria-label="굵게"><i style="width:18px;height:18px"></i></button>
              <span class="tool-sep"></span>
              <button class="icon-btn" id="eraser" title="지우개" aria-label="지우개"><svg viewBox="0 0 24 24"><path d="M16 3l5 5-11 11H5l-2-2z"/><path d="M10 19h11"/><path d="M11 8l5 5"/></svg></button>
              <button class="icon-btn" id="undo" title="되돌리기" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
              <button class="icon-btn" id="clear" title="전부 지우기" aria-label="전부 지우기"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
              <button class="icon-btn" id="example" title="예시 그림" aria-label="예시 그림"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg></button>
            </div>
            <div class="crayon-label" id="crayon-label"></div>
          </div>
        </div>
        <div class="ws-right">
          <div class="item-card" id="item-card">
            <div class="ic-head"><span class="tier" id="w-tier">—</span><span class="ic-kind" id="w-kind"></span></div>
            <div class="ic-main">
              <canvas id="w-thumb" width="184" height="184"></canvas>
              <div><h3 id="w-name">빈 종이</h3><p id="w-type">그리는 순간 무기가 돼요</p></div>
            </div>
            <div id="w-stats"></div>
            <div class="effects" id="w-effects"></div>
          </div>
          <button class="btn big" id="forge" disabled><span>출격!</span></button>
          <div class="ws-tip"><b>TIP</b><span id="ws-tip"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const rand = (a, b) => a + Math.random() * (b - a);
    const FONT = "'Black Han Sans', 'Arial Black', sans-serif";

    // ───────────────────────── 색깔(속성) ─────────────────────────
    const PALETTE = [
      { id: 'ink',    name: '먹물',   color: '#1d1f24', rgb: [29, 31, 36],   hint: '한 방 피해량 증가' },
      { id: 'fire',   name: '불꽃',   color: '#e8463c', rgb: [232, 70, 60],  hint: '맞으면 불타요' },
      { id: 'ice',    name: '얼음',   color: '#3d8bef', rgb: [61, 139, 239], hint: '맞으면 느려져요' },
      { id: 'bolt',   name: '번개',   color: '#f2c230', rgb: [242, 194, 48], hint: '옆 적에게 번개가 튀어요' },
      { id: 'toxic',  name: '독',     color: '#3fbf62', rgb: [63, 191, 98],  hint: '맞은 자리에서 독이 터져요' },
      { id: 'shadow', name: '그림자', color: '#9a5cf0', rgb: [154, 92, 240], hint: '적을 뚫고 지나가요' },
    ];
    const TIERS = [
      { name: '일반', color: '#9aa3b5' }, { name: '고급', color: '#5fd068' }, { name: '희귀', color: '#4aa8ff' },
      { name: '영웅', color: '#b46bff' }, { name: '전설', color: '#ffa733' },
    ];
    const TIPS = [
      '많이 칠할수록 한 방이 세지고, 연사는 느려져요.',
      '길쭉하게 그리면 탄이 빠르고 정확해져요.',
      '크게 그리면 탄도 커져서 맞히기 쉬워요.',
      '떨어진 조각 수만큼 탄이 한꺼번에 나가요. (최대 6발)',
      '색을 섞으면 효과도 섞이고, 무기 등급이 올라가요.',
      '게임 중에 Q를 누르면 언제든 무기를 다시 그릴 수 있어요.',
    ];

    // ───────────────────────── 그림판 ─────────────────────────
    const PAD = 400;
    const pad = $('#pad');
    const pctx = pad.getContext('2d', { willReadFrequently: true });
    const brush = { color: 0, size: 10, eraser: false };
    const undoStack = [];
    let drawing = false, lastPt = null, analyzeTimer = 0, currentStats = null;

    const paletteEl = $('#palette');
    PALETTE.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'crayon' + (i === 0 ? ' active' : '');
      b.style.setProperty('--c', p.color);
      b.title = `${p.name} · ${p.hint}`;
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => { brush.color = i; brush.eraser = false; syncTools(); });
      paletteEl.appendChild(b);
    });
    function syncTools() {
      paletteEl.querySelectorAll('.crayon').forEach((s, j) => s.classList.toggle('active', !brush.eraser && j === brush.color));
      $('#eraser').classList.toggle('active', brush.eraser);
      const p = PALETTE[brush.color];
      $('#crayon-label').textContent = brush.eraser ? '지우개' : `${p.name} — ${p.hint}`;
      $('#crayon-label').style.color = brush.eraser ? '#e9e2cf' : (p.id === 'ink' ? '#e9e2cf' : p.color);
    }
    document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
      brush.size = +b.dataset.size;
      document.querySelectorAll('[data-size]').forEach(x => x.classList.toggle('active', x === b));
    }));
    $('#eraser').addEventListener('click', () => { brush.eraser = !brush.eraser; syncTools(); });
    $('#undo').addEventListener('click', () => {
      const snap = undoStack.pop();
      if (snap) { pctx.putImageData(snap, 0, 0); analyzeNow(); }
    });
    $('#clear').addEventListener('click', () => { pushUndo(); pctx.clearRect(0, 0, PAD, PAD); analyzeNow(); });
    $('#example').addEventListener('click', drawExample);
    syncTools();

    function pushUndo() {
      undoStack.push(pctx.getImageData(0, 0, PAD, PAD));
      if (undoStack.length > 25) undoStack.shift();
    }
    function padPos(e) {
      const r = pad.getBoundingClientRect();
      return { x: (e.clientX - r.left) * PAD / r.width, y: (e.clientY - r.top) * PAD / r.height };
    }
    function strokeTo(p) {
      pctx.globalCompositeOperation = brush.eraser ? 'destination-out' : 'source-over';
      pctx.strokeStyle = PALETTE[brush.color].color;
      pctx.lineWidth = brush.eraser ? brush.size * 2 : brush.size;
      pctx.lineCap = 'round'; pctx.lineJoin = 'round';
      pctx.beginPath(); pctx.moveTo(lastPt.x, lastPt.y); pctx.lineTo(p.x, p.y); pctx.stroke();
      pctx.globalCompositeOperation = 'source-over';
      lastPt = p;
    }
    pad.addEventListener('pointerdown', e => {
      e.preventDefault();
      pad.setPointerCapture(e.pointerId);
      pushUndo();
      drawing = true;
      lastPt = padPos(e);
      strokeTo({ x: lastPt.x + 0.01, y: lastPt.y });
      analyzeSoon();
    });
    pad.addEventListener('pointermove', e => {
      if (!drawing) return;
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of (events.length ? events : [e])) strokeTo(padPos(ev));
      analyzeSoon();
    });
    const endStroke = () => { if (drawing) { drawing = false; analyzeNow(); } };
    pad.addEventListener('pointerup', endStroke);
    pad.addEventListener('pointercancel', endStroke);

    function analyzeSoon() {
      if (analyzeTimer) return;
      analyzeTimer = setTimeout(analyzeNow, 120);
    }
    function analyzeNow() {
      clearTimeout(analyzeTimer); analyzeTimer = 0;
      currentStats = analyzeDrawing();
      renderStats(currentStats);
    }

    // 예시 그림
    let exampleIdx = 0;
    function drawExample() {
      pushUndo();
      pctx.clearRect(0, 0, PAD, PAD);
      const g = pctx;
      g.lineCap = 'round'; g.lineJoin = 'round';
      const k = exampleIdx++ % 3;
      if (k === 0) { // 먹물 + 불꽃 블래스터
        g.fillStyle = PALETTE[0].color;
        g.beginPath(); g.roundRect(80, 150, 190, 60, 14); g.fill();
        g.beginPath(); g.moveTo(110, 200); g.lineTo(165, 200); g.lineTo(145, 290); g.lineTo(95, 285); g.closePath(); g.fill();
        g.fillStyle = PALETTE[1].color;
        g.fillRect(262, 165, 58, 30);
        g.beginPath(); g.moveTo(320, 160); g.lineTo(350, 180); g.lineTo(320, 200); g.closePath(); g.fill();
        g.strokeStyle = PALETTE[1].color; g.lineWidth = 8;
        g.beginPath(); g.moveTo(100, 168); g.lineTo(240, 168); g.stroke();
      } else if (k === 1) { // 얼음 + 번개 창
        g.strokeStyle = PALETTE[2].color; g.lineWidth = 14;
        g.beginPath(); g.moveTo(40, 250); g.lineTo(330, 150); g.stroke();
        g.fillStyle = PALETTE[2].color;
        g.beginPath(); g.moveTo(320, 130); g.lineTo(375, 135); g.lineTo(335, 175); g.closePath(); g.fill();
        g.strokeStyle = PALETTE[3].color; g.lineWidth = 7;
        g.beginPath(); g.moveTo(80, 220); g.lineTo(130, 190); g.lineTo(150, 215); g.lineTo(210, 172); g.lineTo(230, 192); g.lineTo(290, 152); g.stroke();
      } else { // 독 + 그림자 산탄 (떨어진 조각 4개)
        g.fillStyle = PALETTE[4].color;
        [[120, 110, 40], [250, 120, 34], [170, 260, 46]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
        g.fillStyle = PALETTE[5].color;
        g.beginPath(); g.arc(300, 250, 30, 0, Math.PI * 2); g.fill();
        g.strokeStyle = PALETTE[0].color; g.lineWidth = 5;
        [[120, 110], [250, 120], [170, 260], [300, 250]].forEach(([x, y]) => {
          g.beginPath(); g.arc(x - 8, y - 6, 5, 0, Math.PI * 2); g.arc(x + 10, y - 6, 5, 0, Math.PI * 2); g.stroke();
        });
      }
      analyzeNow();
    }

    // ───────────────────────── 그림 → 무기 분석 ─────────────────────────
    function analyzeDrawing() {
      const data = pctx.getImageData(0, 0, PAD, PAD).data;
      const counts = new Array(PALETTE.length).fill(0);
      const G = 80, CELL = PAD / G;
      const grid = new Uint16Array(G * G);
      let ink = 0, minX = PAD, minY = PAD, maxX = -1, maxY = -1;
      for (let y = 0; y < PAD; y++) {
        for (let x = 0; x < PAD; x++) {
          const i = (y * PAD + x) * 4;
          if (data[i + 3] < 100) continue;
          ink++;
          let best = 0, bd = Infinity;
          for (let c = 0; c < PALETTE.length; c++) {
            const p = PALETTE[c].rgb;
            const d = (data[i] - p[0]) ** 2 + (data[i + 1] - p[1]) ** 2 + (data[i + 2] - p[2]) ** 2;
            if (d < bd) { bd = d; best = c; }
          }
          counts[best]++;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
          grid[((y / CELL) | 0) * G + ((x / CELL) | 0)]++;
        }
      }
      if (ink < 350) return { valid: false, ink };

      // 떨어진 조각 수 (작은 점은 무시)
      const seen = new Uint8Array(G * G);
      let pieces = 0;
      for (let i = 0; i < G * G; i++) {
        if (seen[i] || grid[i] < 3) continue;
        let size = 0; const stack = [i]; seen[i] = 1;
        while (stack.length) {
          const c = stack.pop(); size++;
          const cx = c % G, cy = (c / G) | 0;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const nx = cx + dx, ny = cy + dy;
            if (nx < 0 || ny < 0 || nx >= G || ny >= G) continue;
            const n = ny * G + nx;
            if (!seen[n] && grid[n] >= 3) { seen[n] = 1; stack.push(n); }
          }
        }
        if (size >= 5) pieces++;
      }
      pieces = clamp(pieces, 1, 6);

      // 총구 위치 = 그림의 가장 오른쪽 부분
      const bw = maxX - minX + 1, bh = maxY - minY + 1;
      const band = Math.max(4, bw * 0.06);
      let my = 0, mn = 0;
      for (let y = minY; y <= maxY; y++) for (let x = Math.floor(maxX - band); x <= maxX; x++) {
        if (data[(y * PAD + x) * 4 + 3] >= 100) { my += y; mn++; }
      }
      const muzzle = { x: maxX, y: mn ? my / mn : (minY + maxY) / 2 };

      const share = {};
      PALETTE.forEach((p, i) => { const s = counts[i] / ink; share[p.id] = s < 0.08 ? 0 : s; });
      let dominant = 0;
      counts.forEach((c, i) => { if (c > counts[dominant]) dominant = i; });
      const colorsUsed = PALETTE.filter(p => share[p.id] > 0).length;

      const weight = clamp((ink / (PAD * PAD) - 0.012) / 0.13, 0, 1);
      const elong = Math.max(bw, bh) / Math.max(1, Math.min(bw, bh));
      const sleek = clamp((elong - 1) / 3, 0, 1);
      const span = Math.max(bw, bh) / PAD;

      const damage = (10 + 50 * weight) * (1 + 0.6 * share.ink);
      const perPellet = pieces === 1 ? damage : damage * 1.3 / pieces;
      const fireRate = 7 - 5.5 * weight;
      const speed = 9 + 16 * sleek;
      const spread = pieces > 1 ? 0.05 + 0.025 * pieces : 0.06 * (1 - sleek);
      const radius = 0.1 + 0.22 * span;
      const mag = Math.round(clamp(4 + fireRate * 2.4, 4, 22));
      const reload = 0.7 + 1.3 * weight;

      const fx = {
        ink: share.ink,
        burn: share.fire ? perPellet * 0.9 * share.fire : 0,
        slow: share.ice ? clamp(0.75 * share.ice + 0.15, 0, 0.8) : 0,
        chain: share.bolt ? clamp(share.bolt * 1.5, 0, 1) : 0,
        splash: share.toxic ? 0.9 + 1.8 * share.toxic : 0,
        splashDmg: share.toxic ? perPellet * (0.35 + 0.5 * share.toxic) : 0,
        pierce: share.shadow ? Math.max(1, Math.round(share.shadow * 4)) : 0,
      };

      const prefix = colorsUsed >= 3 && counts[dominant] / ink < 0.5 ? '무지개' : PALETTE[dominant].name;
      let type;
      if (pieces >= 3) type = '산탄 낙서포';
      else if (sleek > 0.6 && weight < 0.5) type = '저격 붓';
      else if (weight > 0.62) type = '낙서 대포';
      else if (fireRate > 5.2) type = '연사 크레용';
      else type = '낙서 블래스터';

      // 등급: 화력 + 붙은 효과 수
      const dps = perPellet * pieces * fireRate;
      const specials = PALETTE.filter(p => p.id !== 'ink' && share[p.id] > 0).length;
      const power = clamp(dps / 150, 0, 1) * 1.6 + specials + (pieces > 1 ? 0.4 : 0) + (share.ink ? 0.3 : 0);
      const tier = power < 1.3 ? 0 : power < 2.3 ? 1 : power < 3.3 ? 2 : power < 4.3 ? 3 : 4;

      return {
        valid: true, ink, share, dominant, pieces, weight, sleek, span, muzzle, tier,
        bbox: { x: minX, y: minY, w: bw, h: bh },
        damage, perPellet, fireRate, speed, spread, radius, mag, reload, fx,
        name: `${prefix}의 ${type}`, type,
      };
    }

    const thumbCtx = $('#w-thumb').getContext('2d');
    function renderStats(st) {
      $('#pad-hint').classList.toggle('hidden', st.ink > 0);
      $('#forge').disabled = !st.valid;
      const card = $('#item-card');
      thumbCtx.clearRect(0, 0, 184, 184);
      if (!st.valid) {
        card.style.setProperty('--tc', '#4a5368');
        $('#w-tier').textContent = '—';
        $('#w-kind').textContent = '';
        $('#w-name').textContent = st.ink > 0 ? '조금만 더!' : '빈 종이';
        $('#w-type').textContent = st.ink > 0 ? '무기가 되기엔 잉크가 부족해요' : '그리는 순간 무기가 돼요';
        $('#w-stats').innerHTML = '<div class="empty-note">왼쪽 종이에 그려보세요 ✎</div>';
        $('#w-effects').innerHTML = '';
        return;
      }
      const tier = TIERS[st.tier];
      card.style.setProperty('--tc', tier.color);
      $('#w-tier').textContent = tier.name;
      $('#w-kind').textContent = st.pieces > 1 ? `산탄 ${st.pieces}발` : '단발';
      $('#w-name').textContent = st.name;
      $('#w-type').textContent = `잉크 ${(st.ink / (PAD * PAD) * 100).toFixed(1)}% · 조각 ${st.pieces}개`;
      const { x, y, w, h } = st.bbox, s = 150 / Math.max(w, h);
      thumbCtx.drawImage(pad, x, y, w, h, 92 - w * s / 2, 92 - h * s / 2, w * s, h * s);

      const rows = [
        ['피해량', st.perPellet * st.pieces / 100, st.pieces > 1 ? `${st.perPellet.toFixed(0)}×${st.pieces}` : st.perPellet.toFixed(0)],
        ['연사', st.fireRate / 7, `${st.fireRate.toFixed(1)}/초`],
        ['탄속', st.speed / 25, st.speed.toFixed(0)],
        ['탄 크기', st.radius / 0.32, `${(st.radius * 100).toFixed(0)}`],
        ['탄창', st.mag / 22, `${st.mag}발`],
        ['재장전', 1 - (st.reload - 0.7) / 1.3, `${st.reload.toFixed(1)}초`],
      ];
      $('#w-stats').innerHTML = rows.map(([k, v, t]) => {
        const on = Math.max(1, Math.round(clamp(v, 0, 1) * 10));
        return `<div class="stat"><span>${k}</span><div class="segs">${'<i class="on"></i>'.repeat(on)}${'<i></i>'.repeat(10 - on)}</div><b>${t}</b></div>`;
      }).join('');
      const fx = st.fx, list = [];
      if (st.share.ink) list.push(['ink', '먹물', `피해 +${Math.round(fx.ink * 60)}%`]);
      if (st.share.fire) list.push(['fire', '화상', `${fx.burn.toFixed(0)}/초`]);
      if (st.share.ice) list.push(['ice', '둔화', `${Math.round(fx.slow * 100)}%`]);
      if (st.share.bolt) list.push(['bolt', '연쇄', `${Math.round(fx.chain * 100)}%`]);
      if (st.share.toxic) list.push(['toxic', '독 폭발', `반경 ${fx.splash.toFixed(1)}`]);
      if (st.share.shadow) list.push(['shadow', '관통', `${fx.pierce}회`]);
      $('#w-effects').innerHTML = list.map(([id, n, v]) =>
        `<span class="fx" style="--c:${PALETTE.find(p => p.id === id).color}"><i></i><b>${n}</b>${v}</span>`).join('');
    }

    let tipIdx = 0;
    function nextTip() { $('#ws-tip').textContent = TIPS[tipIdx++ % TIPS.length]; }
    nextTip();
    setInterval(() => { if (state === 'workshop') nextTip(); }, 5000);

    // 분석 결과로 실제 무기(손에 든 그림 + 탄 그림) 만들기
    function forgeWeapon(st) {
      const P = 7;
      const { x, y, w, h } = st.bbox;
      const sx = Math.max(0, x - 2), sy = Math.max(0, y - 2);
      const sw = Math.min(PAD, x + w + 2) - sx, sh = Math.min(PAD, y + h + 2) - sy;
      const crop = document.createElement('canvas');
      crop.width = sw; crop.height = sh;
      crop.getContext('2d').drawImage(pad, sx, sy, sw, sh, 0, 0, sw, sh);

      const sticker = document.createElement('canvas');
      sticker.width = crop.width + P * 2; sticker.height = crop.height + P * 2;
      const sg = sticker.getContext('2d');
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2;
        sg.drawImage(crop, P + Math.cos(a) * 5, P + Math.sin(a) * 5);
      }
      sg.globalCompositeOperation = 'source-in';
      sg.fillStyle = '#fbf8f1'; sg.fillRect(0, 0, sticker.width, sticker.height);
      sg.globalCompositeOperation = 'source-over';
      sg.drawImage(crop, P, P);

      const color = PALETTE[st.dominant].color;
      const frames = [];
      for (let i = 0; i < 8; i++) {
        const f = document.createElement('canvas'); f.width = f.height = 96;
        const g = f.getContext('2d');
        const halo = g.createRadialGradient(48, 48, 4, 48, 48, 48);
        halo.addColorStop(0, color + 'aa'); halo.addColorStop(1, color + '00');
        g.fillStyle = halo; g.fillRect(0, 0, 96, 96);
        const s = 66 / Math.max(sticker.width, sticker.height);
        g.translate(48, 48); g.rotate(i * Math.PI / 4); g.scale(s, s);
        g.drawImage(sticker, -sticker.width / 2, -sticker.height / 2);
        frames.push(f);
      }
      return {
        ...st, sticker, frames, color,
        padData: pctx.getImageData(0, 0, PAD, PAD),
        muzzleLocal: { x: P + st.muzzle.x - sx, y: P + st.muzzle.y - sy },
      };
    }

    // ───────────────────────── 맵 & 텍스처 ─────────────────────────
    const MAP = [
      '########################',
      '#......#.........#.....#',
      '#......#.........#.....#',
      '#..@@..#...%%....#..@..#',
      '#..@@......%%.......@..#',
      '#......................#',
      '###.....#######....#####',
      '#.......#.....#........#',
      '#.......#.....#........#',
      '#...%%..........@@.....#',
      '#...%%..........@@.....#',
      '#......................#',
      '#####....%%..%%....##..#',
      '#........%....%........#',
      '#........%....%........#',
      '#...@....%%..%%....@...#',
      '#...@..............@...#',
      '#......................#',
      '#..######.....######...#',
      '#......................#',
      '#.......%%.....%%......#',
      '#.......%%.....%%......#',
      '#......................#',
      '########################',
    ];
    const MW = MAP[0].length, MH = MAP.length;
    const tileAt = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? '#' : MAP[y][x];
    const isWall = (x, y) => tileAt(Math.floor(x), Math.floor(y)) !== '.';
    const OPEN = [];
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (MAP[y][x] === '.') OPEN.push([x, y]);

    function seeded(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
    function sketch(g, r, x1, y1, x2, y2, amp = 1.4) {
      g.beginPath();
      g.moveTo(x1 + (r() - .5) * amp, y1 + (r() - .5) * amp);

    function hitEnemy(e, s) {
      const W = weapon, fx = W.fx;
      damageEnemy(e, W.perPellet, '#fff');
      hitT = 0.12; sfx.hit();
      burst(s.x, s.y, s.z, W.color, 6, 1.6);
      if (fx.burn) { e.burnT = 3; e.burnDps = Math.max(e.burnDps, fx.burn); }
      if (fx.slow) { e.slowT = 2.2; e.slowF = Math.max(e.slowF, fx.slow); }
      if (fx.chain && Math.random() < fx.chain) chainFrom(e, W.perPellet * 0.6, fx.chain >= 0.75 ? 2 : 1);
      if (fx.splash) toxicBlast(s.x, s.y, e);
    }
    function chainFrom(src, dmg, jumps) {
      let from = src; const used = new Set([src]);
      for (let j = 0; j < jumps; j++) {
        let best = null, bd = 4.5;
        for (const e of enemies) {
          if (e.dead || used.has(e)) continue;
          const d = Math.hypot(e.x - from.x, e.y - from.y);
          if (d < bd && lineOfSight(from.x, from.y, e.x, e.y)) { bd = d; best = e; }
        }
        if (!best) break;
        arcs.push({ a: [from.x, from.y, from.T.size * 0.5], b: [best.x, best.y, best.T.size * 0.5], life: 0.18 });
        used.add(best);

    }
    function toxicBlast(x, y, direct) {
      const R = weapon.fx.splash;
      for (const e of enemies) {
        if (e.dead || e === direct) continue;
        if (Math.hypot(e.x - x, e.y - y) < R + e.T.r) damageEnemy(e, weapon.fx.splashDmg, '#8ef0a5');
      }
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2, sp = rand(0.5, 1) * R * 1.6;
        particles.push({ x, y, z: 0.35, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: rand(0, 0.8), g: 0, drag: 3,
          life: 0.6, max: 0.6, color: '#3fbf62', size: rand(0.05, 0.1) });

    function burst(x, y, z, color, n, power) {
      for (let i = 0; i < n; i++) {

        particles.push({ x, y, z, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: rand(0.5, 2.5), g: 6, drag: 1,
          life: rand(0.35, 0.8), max: 0.8, color, size: rand(0.018, 0.04) });
      }

    function hurtPlayer(dmg) {
      player.hp -= dmg; hurtT = 1; sfx.hurt();
      if (player.hp <= 0) { player.hp = 0; gameOver(); }
    }

    // ───────────────────────── 업데이트 ─────────────────────────
    function update(dt) {
      if (keys.ArrowLeft) player.a -= 2.4 * dt;
      if (keys.ArrowRight) player.a += 2.4 * dt;
      const dx = Math.cos(player.a), dy = Math.sin(player.a);
      const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
      const str = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      let mx = dx * fwd - dy * str, my = dy * fwd + dx * str;
      const ml = Math.hypot(mx, my);
      if (ml > 0) { mx /= ml; my /= ml; moveBody(player, mx * 3.8 * dt, my * 3.8 * dt, 0.25); player.bob += dt * 9; }
      player.move += ((ml > 0 ? 1 : 0) - player.move) * Math.min(1, dt * 8);
      computeFlow();

      fireCd -= dt; recoil = Math.max(0, recoil - dt * 6); muzzleT -= dt; hitT -= dt; hurtT = Math.max(0, hurtT - dt * 2.2);
      if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { reloadT = 0; ammo = weapon.mag; } }
      if ((firing || keys.Space) && fireCd <= 0 && reloadT <= 0 && ammo > 0) shoot();

      if (intermission > 0) { intermission -= dt; if (intermission <= 0) startWave(wave + 1); }
      else {
        spawnTimer -= dt;
        if (spawnQueue.length && spawnTimer <= 0 && enemies.length < maxAlive) {
          spawnEnemy(spawnQueue.shift());
          spawnTimer = Math.max(0.35, 1.1 - wave * 0.06);
        }
        if (!spawnQueue.length && !enemies.length) waveClear();
      }

      for (const e of enemies) {
        const T = e.T;
        e.flash -= dt;
        if (e.burnT > 0) {
          e.burnT -= dt; damageEnemy(e, e.burnDps * dt, '#ff9a4a', false, false);
          if (e.burnT <= 0) e.burnDps = 0;
        }
        if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 0; }
        e.fxT -= dt;
        if (e.fxT <= 0 && (e.burnT > 0 || e.slowT > 0)) {
          e.fxT = 0.09;
          const fire = e.burnT > 0 && (e.slowT <= 0 || Math.random() < 0.5);
          particles.push({ x: e.x + rand(-.2, .2), y: e.y + rand(-.2, .2), z: T.size * rand(0.3, 0.8), vx: 0, vy: 0,
            vz: fire ? 1 : -0.3, g: 0, drag: 0, life: 0.5, max: 0.5, color: fire ? '#ff8a3d' : '#a8dcff', size: 0.05 });
        }
        if (e.dead) continue;

        const px = player.x - e.x, py = player.y - e.y, dist = Math.hypot(px, py);
        const los = dist < 14 && lineOfSight(e.x, e.y, player.x, player.y);
        const spd = T.speed * (1 - e.slowF);
        let tx = player.x, ty = player.y, moving = true;
        if (!los) {
          const cx = Math.floor(e.x), cy = Math.floor(e.y);
          let bestD = flow[cy * MW + cx], bx = cx, by = cy;
          for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const v = flow[(cy + oy) * MW + cx + ox];
            if (v >= 0 && (bestD < 0 || v < bestD)) { bestD = v; bx = cx + ox; by = cy + oy; }
          }
          tx = bx + 0.5; ty = by + 0.5;
        }
        if (T.ranged && los && dist < 7 && dist > 2.2) moving = false;
        if (moving && dist > T.r + 0.3) {
          const vx = tx - e.x, vy = ty - e.y, vl = Math.hypot(vx, vy) || 1;
          moveBody(e, vx / vl * spd * dt, vy / vl * spd * dt, T.r * 0.9);

        e.t += dt * (moving ? spd * 2.2 : 0.8);
        if (T.ranged) {
          e.shootCd -= dt;
          if (los && dist < 9 && e.shootCd <= 0) {
            e.shootCd = rand(1.8, 2.8);
            spits.push({ x: e.x, y: e.y, vx: px / dist * 6.5, vy: py / dist * 6.5, life: 4 });
            sfx.spit();
          }
        }
        e.atkCd -= dt;
        if (dist < T.r + 0.42 && e.atkCd <= 0) { e.atkCd = 1; hurtPlayer(T.dmg); if (state !== 'playing') return; }
      }
      for (let i = 0; i < enemies.length; i++) {
        const a = enemies[i];
        for (let j = i + 1; j < enemies.length; j++) {
          const b = enemies[j], ox = b.x - a.x, oy = b.y - a.y, d = Math.hypot(ox, oy), min = a.T.r + b.T.r;
          if (d > 0.001 && d < min) {

            moveBody(b, ox / d * push, oy / d * push, b.T.r * 0.9);
          }
        }
        const ox = a.x - player.x, oy = a.y - player.y, d = Math.hypot(ox, oy), min = a.T.r + 0.3;
        if (d > 0.001 && d < min) moveBody(a, ox / d * (min - d), oy / d * (min - d), a.T.r * 0.9);
      }
      enemies = enemies.filter(e => !e.dead);

      for (const s of shots) {
        const sp = Math.hypot(s.vx, s.vy) * dt, steps = Math.max(1, Math.ceil(sp / 0.15));

      enemies = enemies.filter(e => !e.dead);

      for (const s of spits) {
        s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
        if (isWall(s.x, s.y)) { s.life = 0; burst(s.x, s.y, 0.4, '#2f8f9a', 6, 1); }

      for (const a of arcs) a.life -= dt;

      if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('#banner').classList.remove('show'); }

    }

    const hudCache = {};
    function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }

    function updateHud() {
      setText('#wave-label', `웨이브 ${wave}`);
      const left = enemies.length + spawnQueue.length;
      setText('#enemy-label', intermission > 0 ? `다음 웨이브까지 ${Math.ceil(intermission)}초` : `남은 적 ${left}`);
      setCache('enemyW', intermission > 0 ? 0 : left / waveTotal, v => { $('#enemy-fill').style.width = `${v * 100}%`; });
      setText('#hp-text', `${Math.ceil(player.hp)}`);
      setCache('hp', player.hp / player.maxHp, v => {
        $('#hp-fill').style.width = `${v * 100}%`;
        $('#hud-hp').classList.toggle('low', v < 0.35);
      });
      setText('#weapon-name', weapon.name);
      const reloading = reloadT > 0;
      setCache('reloading', reloading, v => $('#hud-ammo').classList.toggle('reloading', v));
      setText('#ammo', reloading ? '재장전' : `${ammo}`);
      setText('#ammo-max', reloading ? '' : `/ ${weapon.mag}`);
      const filled = reloading ? Math.floor((1 - reloadT / weapon.reload) * weapon.mag) : ammo;
      setCache('pips', filled, v => {
        const pips = $('#ammo-pips').children;

      });
    }

    // ───────────────────────── 그리기 ─────────────────────────
    let view = null;
    function render(full) {

      if (!w || !h) return;
      full = full && !!weapon;
      const focal = Math.min(w / 2 / 0.66, h * 1.25);
      const dirX = Math.cos(player.a), dirY = Math.sin(player.a);
      const planeLen = (w / 2) / focal;
      const plX = -dirY * planeLen, plY = dirX * planeLen;
      const bobY = Math.sin(player.bob) * 4 * player.move;
      const horizon = h / 2 + bobY;
      const colW = 2, rays = Math.ceil(w / colW);
      if (zbuf.length !== rays) zbuf = new Float32Array(rays);

      g.addColorStop(0, '#1d2531'); g.addColorStop(1, '#4b5b6e');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon + 1);
      g = ctx.createLinearGradient(0, horizon, 0, h);

      const px = player.x, py = player.y;
      ctx.fillStyle = '#0c1018';
      for (let i = 0; i < rays; i++) {
        const camX = 2 * (i * colW + colW / 2) / w - 1;
        const rdx = dirX + plX * camX, rdy = dirY + plY * camX;
        let mx = Math.floor(px), my = Math.floor(py);
        const ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
        let stepX, stepY, sdx, sdy, side = 0, tile = '#';
        if (rdx < 0) { stepX = -1; sdx = (px - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - px) * ddx; }
        if (rdy < 0) { stepY = -1; sdy = (py - my) * ddy; } else { stepY = 1; sdy = (my + 1 - py) * ddy; }
        for (let n = 0; n < 64; n++) {
          if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; } else { sdy += ddy; my += stepY; side = 1; }
          tile = tileAt(mx, my);
          if (tile !== '.') break;
        }
        const dist = Math.max(0.05, side === 0 ? sdx - ddx : sdy - ddy);
        zbuf[i] = dist;
        let wallX = side === 0 ? py + dist * rdy : px + dist * rdx;
        wallX -= Math.floor(wallX);
        let texX = Math.floor(wallX * TEX);
        if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) texX = TEX - texX - 1;
        const lineH = focal / dist, top = horizon - lineH / 2;

        ctx.drawImage(tex, texX, 0, 1, TEX, i * colW, top, colW + 0.5, lineH);

      }
      ctx.globalAlpha = 1;

      const list = [];
      for (const e of enemies) {
        const spr = enemySprites[e.type];
        const img = e.flash > 0 ? spr.flash : spr.walk[Math.floor(e.t * 1.6) % 2];
        const bounce = Math.abs(Math.sin(e.t * 1.6 * Math.PI)) * 0.04;
        list.push({ x: e.x, y: e.y, draw: d => { drawSprite(img, e.x, e.y, e.T.size / 2 + bounce, e.T.size, d); if (full) drawEnemyBar(e); } });
      }
      if (weapon) for (const s of shots) {
        const img = weapon.frames[Math.floor(s.spin) % 8];
        list.push({ x: s.x, y: s.y, minD: 1.4, draw: d => drawSprite(img, s.x, s.y, s.z, 0.16 + weapon.radius * 0.9, d) });
      }
      for (const s of spits) list.push({ x: s.x, y: s.y, draw: d => drawSprite(spitSprite, s.x, s.y, 0.45, 0.22, d) });
      for (const p of particles) list.push({ x: p.x, y: p.y, draw: () => drawParticle(p) });
      for (const it of list) it.d = (it.x - px) * dirX + (it.y - py) * dirY;
      list.sort((a, b) => b.d - a.d);
      for (const it of list) if (it.d > (it.minD || 0.12)) it.draw(it.d);
      for (const a of arcs) drawArc(a);
      for (const t of texts) drawText(t);

      if (!full) return;
      drawWeapon(w, h);
      drawCrosshair(w, h);
      drawMinimap(w);
      const low = player.hp < 35 ? (35 - player.hp) / 35 * 0.35 : 0;
      const red = Math.max(hurtT * 0.5, low);
      if (red > 0.01) {
        const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.7);
        vg.addColorStop(0, 'rgba(200,30,30,0)'); vg.addColorStop(1, `rgba(200,30,30,${red})`);
        ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
      }
    }

    function project(x, y, z) {
      const { w, focal, dirX, dirY, horizon } = view;
      const rx = x - player.x, ry = y - player.y;
      const depth = rx * dirX + ry * dirY;
      if (depth < 0.12) return null;
      const lat = -rx * dirY + ry * dirX;
      return { sx: w / 2 + lat / depth * focal, sy: horizon - (z - 0.5) * focal / depth, depth, scale: focal / depth };
    }
    function drawSprite(img, x, y, zc, worldH, depth) {
      const p = project(x, y, zc);
      if (!p) return;
      const { colW, rays } = view;
      const sh = worldH * p.scale, sw = sh * img.width / img.height;
      const left = p.sx - sw / 2, top = p.sy - sh / 2;
      const c0 = Math.max(0, Math.floor(left / colW)), c1 = Math.min(rays - 1, Math.floor((left + sw) / colW));
      let runStart = -1;
      for (let c = c0; c <= c1 + 1; c++) {
        const visible = c <= c1 && depth < zbuf[c];
        if (visible && runStart < 0) runStart = c;
        if (!visible && runStart >= 0) {
          const x0 = Math.max(left, runStart * colW), x1 = Math.min(left + sw, c * colW);
          if (x1 > x0) {
            const u0 = (x0 - left) / sw * img.width, u1 = (x1 - left) / sw * img.width;
            ctx.drawImage(img, u0, 0, Math.max(0.5, u1 - u0), img.height, x0, top, x1 - x0, sh);
          }
          runStart = -1;
        }
      }
    }
    function visibleAt(p) {
      const c = Math.floor(p.sx / view.colW);
      return c >= 0 && c < view.rays && p.depth < zbuf[c];
    }
    function drawEnemyBar(e) {
      if (e.hp >= e.maxHp) return;
      const p = project(e.x, e.y, e.T.size + 0.12);
      if (!p || !visibleAt(p)) return;
      const bw = Math.min(70, 0.7 * p.scale), bh = Math.max(3, Math.min(7, 0.06 * p.scale));
      ctx.fillStyle = '#000a'; ctx.fillRect(p.sx - bw / 2 - 1, p.sy - 1, bw + 2, bh + 2);
      ctx.fillStyle = e.burnT > 0 ? '#ff9a4a' : e.slowT > 0 ? '#8fd0ff' : '#ff5a4e';
      ctx.fillRect(p.sx - bw / 2, p.sy, bw * Math.max(0, e.hp / e.maxHp), bh);
    }
    function drawParticle(pt) {
      const p = project(pt.x, pt.y, pt.z);
      if (!p || !visibleAt(p)) return;
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life / pt.max * 1.5));
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, Math.min(16, Math.max(1, pt.size * p.scale)), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    function drawArc(a) {
      const p1 = project(...a.a), p2 = project(...a.b);
      if (!p1 || !p2) return;
      ctx.strokeStyle = '#fff6a8'; ctx.lineWidth = 3; ctx.shadowColor = '#f2c230'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy);
      for (let i = 1; i < 6; i++) {
        const t = i / 6;
        ctx.lineTo(p1.sx + (p2.sx - p1.sx) * t + rand(-10, 10), p1.sy + (p2.sy - p1.sy) * t + rand(-10, 10));
      }
      ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    function drawText(t) {
      const p = project(t.x, t.y, t.z);
      if (!p || !visibleAt(p)) return;
      ctx.globalAlpha = Math.min(1, t.life / t.max * 2);
      ctx.font = `20px ${FONT}`; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000c'; ctx.strokeText(t.text, p.sx, p.sy);
      ctx.fillStyle = t.color; ctx.fillText(t.text, p.sx, p.sy);
      ctx.globalAlpha = 1;
    }
    function drawFloorGrid() {
      const { w, focal, dirX, dirY, horizon } = view;
      const R = 9, cx = Math.floor(player.x), cy = Math.floor(player.y);
      const proj = (x, y, d) => [w / 2 + (-(x - player.x) * dirY + (y - player.y) * dirX) / d * focal, horizon + 0.5 * focal / d];
      const seg = (x1, y1, x2, y2) => {
        let d1 = (x1 - player.x) * dirX + (y1 - player.y) * dirY, d2 = (x2 - player.x) * dirX + (y2 - player.y) * dirY;
        const near = 0.2;
        if (d1 < near && d2 < near) return;
        if (d1 < near) { const t = (near - d1) / (d2 - d1); x1 += (x2 - x1) * t; y1 += (y2 - y1) * t; d1 = near; }
        if (d2 < near) { const t = (near - d2) / (d1 - d2); x2 += (x1 - x2) * t; y2 += (y1 - y2) * t; d2 = near; }
        const a = proj(x1, y1, d1), b = proj(x2, y2, d2);
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      };
      ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
      ctx.beginPath();
      const x0 = Math.max(0, cx - R), x1 = Math.min(MW, cx + R + 1), y0 = Math.max(0, cy - R), y1 = Math.min(MH, cy + R + 1);
      for (let x = x0; x <= x1; x++) seg(x, y0, x, y1);
      for (let y = y0; y <= y1; y++) seg(x0, y, x1, y);
      ctx.stroke();
    }
    function drawWeapon(w, h) {
      const img = weapon.sticker;
      const maxDim = Math.max(img.width, img.height);
      const s = Math.min(w, h) * 0.46 / maxDim;
      const reloadK = reloadT > 0 ? Math.sin((1 - reloadT / weapon.reload) * Math.PI) : 0;
      const bx = Math.sin(player.bob / 2) * 10 * player.move;
      const by = Math.abs(Math.cos(player.bob / 2)) * 8 * player.move;
      const baseX = w * 0.62 + bx + recoil * 10;
      const baseY = h - img.height * s * 0.32 + by + recoil * 18 + reloadK * h * 0.28;
      const rot = 0.32 + reloadK * 0.6 - recoil * 0.08;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#1d1f24'; ctx.lineWidth = Math.min(w, h) * 0.085 + 6;
      ctx.beginPath(); ctx.moveTo(w + 40, h + 40); ctx.lineTo(baseX + 10, baseY + img.height * s * 0.2); ctx.stroke();
      ctx.strokeStyle = '#f2c9a0'; ctx.lineWidth = Math.min(w, h) * 0.085;
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(baseX, baseY); ctx.rotate(rot); ctx.scale(-s, s);
      ctx.shadowColor = '#0008'; ctx.shadowBlur = 10;
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();
      if (muzzleT > 0) {
        const lx = -(weapon.muzzleLocal.x - img.width / 2) * s, ly = (weapon.muzzleLocal.y - img.height / 2) * s;
        const mx = baseX + lx * Math.cos(rot) - ly * Math.sin(rot), my = baseY + lx * Math.sin(rot) + ly * Math.cos(rot);
        const r = 26 + weapon.weight * 30;
        const fg = ctx.createRadialGradient(mx, my, 0, mx, my, r);
        fg.addColorStop(0, '#ffffffee'); fg.addColorStop(0.35, weapon.color + 'cc'); fg.addColorStop(1, weapon.color + '00');
        ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    function drawCrosshair(w, h) {
      const cx = w / 2, cy = h / 2, gap = 5 + recoil * 7;
      ctx.lineCap = 'round';
      for (const [col, lw] of [['#000a', 4.5], ['#fff', 2]]) {
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
        ctx.moveTo(cx - 11 - gap, cy); ctx.lineTo(cx - gap, cy); ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + 11 + gap, cy);
        ctx.moveTo(cx, cy - 11 - gap); ctx.lineTo(cx, cy - gap); ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + 11 + gap);
        ctx.stroke();
      }
      ctx.fillStyle = '#fff'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
      if (hitT > 0) {
        ctx.strokeStyle = '#ff5a4e'; ctx.lineWidth = 3; ctx.beginPath();
        for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.moveTo(cx + sx * 8, cy + sy * 8); ctx.lineTo(cx + sx * 16, cy + sy * 16); }
        ctx.stroke();
      }
    }
    function drawMinimap(w) {
      const size = Math.min(136, w * 0.18), cell = size / MW, ox = w - size - 20, oy = 18;
      ctx.fillStyle = 'rgba(8,10,16,.72)'; ctx.fillRect(ox - 5, oy - 5, size + 10, size + 10);
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.strokeRect(ox - 5, oy - 5, size + 10, size + 10);
      ctx.fillStyle = 'rgba(230,220,198,.6)';
      for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (MAP[y][x] !== '.') ctx.fillRect(ox + x * cell, oy + y * cell, cell + 0.3, cell + 0.3);
      ctx.fillStyle = '#ff5a4e';
      for (const e of enemies) { ctx.beginPath(); ctx.arc(ox + e.x * cell, oy + e.y * cell, Math.max(2, cell * 0.4), 0, Math.PI * 2); ctx.fill(); }
      const px = ox + player.x * cell, py = oy + player.y * cell, a = player.a;
      ctx.fillStyle = '#ffd23f'; ctx.beginPath();
      ctx.moveTo(px + Math.cos(a) * 7, py + Math.sin(a) * 7);
      ctx.lineTo(px + Math.cos(a + 2.5) * 5, py + Math.sin(a + 2.5) * 5);
      ctx.lineTo(px + Math.cos(a - 2.5) * 5, py + Math.sin(a - 2.5) * 5);
      ctx.fill();
    }

    function frame(t) {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      if (state === 'playing') {
        update(dt);
        if (state === 'playing' || state === 'gameover') render(true);
      } else if (state === 'title' || (state === 'workshop' && !workshopFromGame)) {
        player.a += dt * 0.12;
        for (const e of enemies) e.t += dt * 0.9;
        render(false);
      }
      requestAnimationFrame(frame);
    }

    // ───────────────────────── 입력 ─────────────────────────
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (state === 'playing') {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
        if (e.code === 'KeyR') startReload();
        if (e.code === 'KeyQ') openWorkshop(true);
        if ((e.code === 'Escape' && !document.pointerLockElement) || e.code === 'KeyP') pause();
      } else if (state === 'workshop') {
        if (e.code === 'Escape') leaveWorkshop();
        if (e.code === 'Enter' && !$('#forge').disabled) forge();
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); $('#undo').click(); }
      } else if (state === 'paused' && e.code === 'Escape' && performance.now() - pausedAt > 400) {
        resume();
      } else if (state === 'title' && e.code === 'Enter') {
        openWorkshop(false);
      }
      if (e.code === 'KeyM') { muted = !muted; if (state === 'playing') showTip(muted ? '소리 꺼짐' : '소리 켜짐', 1.5); }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; firing = false; });
    document.addEventListener('mousemove', e => {
      if (state === 'playing' && document.pointerLockElement === canvas) player.a += e.movementX * 0.0022;
    });
    canvas.addEventListener('mousedown', e => {
      if (state !== 'playing' || e.button !== 0) return;
      if (document.pointerLockElement !== canvas) lockPointer();
      firing = true;
    });
    window.addEventListener('mouseup', () => { firing = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === canvas) { hadLock = true; return; }
      if (state === 'playing' && hadLock) pause();
    });
    document.addEventListener('pointerlockerror', () => {
      if (state === 'playing') showTip('마우스 잠금을 쓸 수 없어요 · ← → 키로 회전', 5);
    });

    goTitle();
    resize();
    analyzeNow();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
